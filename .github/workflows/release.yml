name: 发布版本

# 推一个 v* 标签就自动走完整条链路：
#   打包 -> 用私钥签名 -> 生成 latest.json -> 建 Release 并把资产挂上去
# 客户端下次启动拉到 latest.json 就会弹窗提示更新。
on:
  push:
    tags:
      - "v*"
  # 也可以在 Actions 页面手动触发，用当前 tauri.conf.json 里的版本号发一版
  workflow_dispatch:

# 创建 Release 需要写权限
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows 安装包与更新清单
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes_file: ${{ steps.notes.outputs.file }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 生成更新说明要回溯上一个标签，必须取全量历史
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 读取版本号
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "本次发布版本：$version"

      - name: 打包并签名
        shell: bash
        env:
          # 私钥来自仓库 Secrets，绝不写进仓库
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "缺少 secrets.TAURI_SIGNING_PRIVATE_KEY，updater 会拒绝未签名的包" >&2
            exit 1
          fi
          npm run tauri build

      - name: 准备更新说明
        id: notes
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          notes="docs/release-notes/${version}.md"
          if [ -f "$notes" ]; then
            echo "使用手写的更新说明：$notes"
            echo "file=$notes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 没手写就退回用提交记录，保证弹窗里一定有内容
          previous=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          range=$([ -n "$previous" ] && echo "${previous}..HEAD" || echo "HEAD")
          {
            echo "本次更新包含以下改动："
            echo
            git log --pretty=format:"- %s" "$range"
            echo
          } > auto-notes.md
          echo "file=auto-notes.md" >> "$GITHUB_OUTPUT"

      - name: 整理 Release 资产
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          nsis="src-tauri/target/release/bundle/nsis"
          mkdir -p release-assets cdn-assets
          # 文件名取自 productName（青灯），资产名换成纯英文
          installer=$(ls "$nsis"/*-setup.exe | head -1)
          updater=$(ls "$nsis"/*-setup.nsis.zip | head -1)
          cp "$installer"     "release-assets/QingDeng_${version}_x64-setup.exe"
          cp "$installer.sig" "release-assets/QingDeng_${version}_x64-setup.exe.sig"
          cp "$updater"       "release-assets/QingDeng_${version}_x64-setup.nsis.zip"
          cp "$updater.sig"   "release-assets/QingDeng_${version}_x64-setup.nsis.zip.sig"
          # cdn 分支只放 updater bundle：jsDelivr 会拦 .exe，只服务 .zip/.apk/.json
          cp "$updater"       "cdn-assets/QingDeng_${version}_x64-setup.nsis.zip"
          cp "$updater.sig"   "cdn-assets/QingDeng_${version}_x64-setup.nsis.zip.sig"
          ls -l release-assets cdn-assets

      - name: 生成 latest.json
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          node scripts/make-update-manifest.mjs \
            --repo "${{ github.repository }}" \
            --asset-name "QingDeng_${version}_x64-setup.nsis.zip" \
            --notes-file "${{ steps.notes.outputs.file }}"
          cp release/latest.json cdn-assets/latest.json
          cp release/latest.json release-assets/latest.json

      # 发布前的闸门：清单里的 signature 必须能验通待上传的更新包。
      # updater 只认签名，配错了用户会「下载成功但更新无反应」，且只有发出去才会发现。
      - name: 校验清单签名与更新包配对
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          node scripts/verify-update-signature.mjs \
            --manifest release/latest.json \
            --artifact "cdn-assets/QingDeng_${version}_x64-setup.nsis.zip"

      # 国内直连 GitHub 下载很慢，所以把更新包再镜像一份到 cdn 分支，
      # 客户端从 jsDelivr 拉（文件名带版本号，命中永久缓存）。
      # 用独立的 GIT_DIR，不碰当前工作区。
      - name: 镜像到 cdn 分支
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GIT_DIR="$RUNNER_TEMP/cdn.git" GIT_WORK_TREE="$RUNNER_TEMP/cdnws"
          mkdir -p "$GIT_WORK_TREE"
          git init -q
          cd "$GIT_WORK_TREE"
          git checkout -q --orphan cdn 2>/dev/null || true
          cp "$GITHUB_WORKSPACE"/cdn-assets/* .
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Publish v${{ steps.version.outputs.version }} to CDN"
          git push -q -f \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" cdn
          ls -l

      # 分支引用在 jsDelivr 上会缓存，发版后主动刷一次，否则最多要等 12 小时
      - name: 刷新 jsDelivr 缓存
        shell: bash
        run: |
          url="https://purge.jsdelivr.net/gh/${{ github.repository }}@cdn/latest.json"
          for attempt in 1 2 3; do
            if curl -fsS --max-time 30 "$url" > /dev/null; then
              echo "缓存已刷新（第 $attempt 次）"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::jsDelivr 缓存刷新失败，清单更新最多延迟 12 小时"

      - name: 创建 Release 并上传资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: 青灯 v${{ steps.version.outputs.version }}
          body_path: ${{ steps.notes.outputs.file }}
          draft: false
          files: release-assets/*

  android:
    name: Android 安装包
    runs-on: ubuntu-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri 的 Android 构建需要 JDK 与 Android SDK/NDK
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: 指定 NDK
        shell: bash
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: 安装前端依赖
        run: npm ci

      - name: 生成 Android 工程
        run: npm run tauri android init

      # APK 必须签名才能安装。密钥库是二进制，只能 base64 后存进 Secrets：
      #   certutil -encode keystore.keystore tmp.txt  或  base64 -w0 keystore.keystore
      # 没配置时仍会构建，只是产出未签名包（不能安装，仅供检查构建是否通过）。
      - name: 准备签名密钥库
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "未配置 ANDROID_KEYSTORE_BASE64，本次构建将产出未签名 APK"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/qingdeng-android.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/qingdeng-android.keystore" >> "$GITHUB_ENV"

      - name: 打包 APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run tauri android build -- --apk

      - name: 把 APK 挂到同一个 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.windows.outputs.version }}
          files: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk

      # APK 不参与自动更新，但平板上要人工下载，同样镜像到 cdn 分支走 jsDelivr。
      # 这里用 clone 而不是强推，否则会把上面那步写进去的安装包冲掉。
      - name: 把 APK 也镜像到 cdn 分支
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ needs.windows.outputs.version }}"
          work="$RUNNER_TEMP/cdnws"
          rm -rf "$work"
          git clone -q --depth 1 --branch cdn \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$work"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
            "$work/QingDeng_${version}_arm64.apk"
          cd "$work"
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Add Android APK for v${version}"
          git push -q origin cdn
          echo "APK 已镜像：https://cdn.jsdelivr.net/gh/${{ github.repository }}@cdn/QingDeng_${version}_arm64.apk"

      # 同文件名重新发布会撞上下载缓存（实测会继续发旧包），所以也刷一次。
      # 正常发版文件名带版本号、不会重发，这里是兼底。
      - name: 刷新 jsDelivr 缓存（APK）
        shell: bash
        run: |
          version="${{ needs.windows.outputs.version }}"
          url="https://purge.jsdelivr.net/gh/${{ github.repository }}@cdn/QingDeng_${version}_arm64.apk"
          for attempt in 1 2 3; do
            if curl -fsS --max-time 30 "$url" > /dev/null; then
              echo "APK 缓存已刷新（第 $attempt 次）"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::APK 缓存刷新失败，旧包可能还会被缓存一段时间"

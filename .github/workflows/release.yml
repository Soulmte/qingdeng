name: 发布版本

# 推一个 v* 标签就自动走完整条链路：
#   打包 -> 用私钥签名 -> 生成 latest.json -> 建 Release 并把资产挂上去
# 客户端下次启动拉到 latest.json 就会弹窗提示更新。
on:
  push:
    tags:
      - "v*"
  # 也可以在 Actions 页面手动触发，用当前 tauri.conf.json 里的版本号发一版
  workflow_dispatch:

# 创建 Release 需要写权限
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows 安装包与更新清单
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes_file: ${{ steps.notes.outputs.file }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 生成更新说明要回溯上一个标签，必须取全量历史
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 读取版本号
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "本次发布版本：$version"

      - name: 打包并签名
        shell: bash
        env:
          # 私钥来自仓库 Secrets，绝不写进仓库
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "缺少 secrets.TAURI_SIGNING_PRIVATE_KEY，updater 会拒绝未签名的包" >&2
            exit 1
          fi
          npm run tauri build

      - name: 准备更新说明
        id: notes
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          notes="docs/release-notes/${version}.md"
          if [ -f "$notes" ]; then
            echo "使用手写的更新说明：$notes"
            echo "file=$notes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 没手写就退回用提交记录，保证弹窗里一定有内容
          previous=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          range=$([ -n "$previous" ] && echo "${previous}..HEAD" || echo "HEAD")
          {
            echo "本次更新包含以下改动："
            echo
            git log --pretty=format:"- %s" "$range"
            echo
          } > auto-notes.md
          echo "file=auto-notes.md" >> "$GITHUB_OUTPUT"

      - name: 整理 Release 资产
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p release-assets
          nsis="src-tauri/target/release/bundle/nsis"
          installer=$(ls "$nsis"/*-setup.exe | head -1)
          # 安装包名取自 productName（青灯），资产名换成纯英文，避免下载地址里出现非 ASCII 字符
          cp "$installer" "release-assets/QingDeng_${version}_x64-setup.exe"
          cp "$installer.sig" "release-assets/QingDeng_${version}_x64-setup.exe.sig"
          ls -l release-assets

      - name: 生成 latest.json
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          node scripts/make-update-manifest.mjs \
            --repo "${{ github.repository }}" \
            --asset-name "QingDeng_${version}_x64-setup.exe" \
            --notes-file "${{ steps.notes.outputs.file }}"
          cp release/latest.json release-assets/latest.json

      - name: 创建 Release 并上传资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: 青灯 v${{ steps.version.outputs.version }}
          body_path: ${{ steps.notes.outputs.file }}
          draft: false
          files: release-assets/*

  android:
    name: Android 安装包
    runs-on: ubuntu-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri 的 Android 构建需要 JDK 与 Android SDK/NDK
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: 指定 NDK
        shell: bash
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: 安装前端依赖
        run: npm ci

      - name: 生成 Android 工程
        run: npm run tauri android init

      - name: 打包 APK
        run: npm run tauri android build -- --apk

      - name: 把 APK 挂到同一个 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.windows.outputs.version }}
          files: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk

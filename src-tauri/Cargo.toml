[package]
name = "qingdeng"
version = "0.3.0"
description = "青灯：桌面专注计时与学习记录工具"
authors = ["qingdeng"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "qingdeng_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.5.0", features = ["sqlite"] }
tauri-plugin-notification = "2.5.0"

# 桌面端才需要阻止休眠，该 crate 没有 Android 实现，按目标平台分区引入
[target.'cfg(not(target_os = "android"))'.dependencies]
keepawake = "0.6.1"
# 应用内更新与更新后重启，同样只有桌面实现
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# 专注助手依赖 WinRT，仅 Windows 编译
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["UI_Shell", "Win32_System_Com"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
